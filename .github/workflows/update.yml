name: Refresh official offer sources
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-offers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scraper.py
      - run: python freshness_guard.py
      - run: python build.py
      - name: Commit refreshed site when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json site
          git diff --cached --quiet || (git commit -m "Refresh official VPS offer links" && git push)
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      # Check out the branch tip, not the SHA the run was dispatched with, so the freshly
      # committed build from the refresh job is what actually gets published.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API_CODE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy site --project-name vps-deals-promo-radar --branch main --commit-dirty=true
